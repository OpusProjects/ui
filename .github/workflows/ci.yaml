name: ui CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml dispatches this on the release PR's branch: a push made with
  # GITHUB_TOKEN starts no workflow, and the PR needs its required checks.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run build
      # The app against a mocked API (tests/e2e/fixtures): no unified-api needed.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile .
